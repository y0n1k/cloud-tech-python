apiVersion: v1
kind: Service
metadata:
  name: python-app-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: python-app # Повинно чітко збігатися з labels у Deployment
  ports:
    - port: 8080        # Внутрішній порт сервісу
      targetPort: 80  # Порт контейнера у побі (containerPort)
      nodePort: 30080   # Зовнішній порт на вузлі (діапазон 30000-32767)