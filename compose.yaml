services:
  redis:
    image: redis:alpine
    container_name: my_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s      # Як часто робити перевірку
      timeout: 3s       # Скільки чекати на відповідь
      retries: 3        # Кількість невдалих спроб до статусу "unhealthy"

  app:
    build: .
    container_name: my_python_app
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/" ]
      interval: 5s
      timeout: 3s
      retries: 3